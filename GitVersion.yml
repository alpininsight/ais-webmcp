# GitVersion 6.8.x; independent Core package and browser-asset version.
workflow: GitFlow/v1
mode: ContinuousDelivery
tag-prefix: '[vV]?'
next-version: 0.1.0
commit-message-incrementing: Enabled
major-version-bump-message: '^(feat|fix|refactor|perf|build|chore|ci|docs|style|test)(\(.+\))?!:|BREAKING CHANGE:'
minor-version-bump-message: '^feat(\(.+\))?:'
patch-version-bump-message: '^(fix|perf)(\(.+\))?:'
no-bump-message: '^(chore|docs|style|test|ci|build|revert)(\(.+\))?:'
branches:
  main:
    regex: ^main$
    label: ''
    increment: Patch
    is-main-branch: true
  develop:
    regex: ^develop$
    label: alpha
    increment: Patch
    track-merge-target: true
  feature:
    regex: ^(feature|feat|fix|ci|chore|docs)[/-](?<BranchName>.+)
    label: alpha.{BranchName}
    source-branches: [develop]
    increment: Inherit
