name: npm publish
# Trusted Publishing for @alpininsightsolutions/webmcp.
# The npm-release environment supplies OIDC. There is no npm token.
on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webmcp-npm-publish
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: alpininsight/.github-private/.github/workflows/gitversion-reusable.yml@main
    with:
      checkout_ref: ${{ github.sha }}
  publish:
    needs: version
    if: needs.version.result == 'success'
    # npm Trusted Publishing rejects self-hosted runners. `general` is self-hosted.
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an npm-v tag or a manual run from main
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          event = os.environ["EVENT_NAME"]
          ref = os.environ["SOURCE_REF"]
          if event == "workflow_dispatch" and ref != "refs/heads/main":
              raise SystemExit("workflow_dispatch publishes only from main")
          if event == "push" and not ref.startswith("refs/tags/npm-v"):
              raise SystemExit("tag publishes only from npm-v*")
          request = urllib.request.Request(
              "https://api.github.com/repos/{repo}/compare/main...{sha}".format(
                  repo=os.environ["GITHUB_REPOSITORY"],
                  sha=os.environ["SOURCE_SHA"],
              ),
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "ais-webmcp-npm-publish",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              status = json.load(response)["status"]
          if status not in {"identical", "behind"}:
              raise SystemExit("commit is not contained in main ({0})".format(status))
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use npm >= 11.5.1
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-cli" npm@11.5.1
          echo "$RUNNER_TEMP/npm-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Require npm >= 11.5.1
        run: |
          version="$(npm --version)"
          node -e 'const v=process.argv[1].split(".").map(Number); if(!(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))) process.exit(1)' "$version"
          echo "npm $version"
      - name: Refuse npm token auth
        run: |
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          test ! -f .npmrc
      - run: npm ci
      - run: npm run check:js-build
      - run: npm test
      - name: Stamp the Python package version
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.major_minor_patch }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            test "$SOURCE_REF" = "refs/tags/npm-v${PACKAGE_VERSION}"
          fi
          node scripts/sync-npm-version.cjs --version "$PACKAGE_VERSION"
      - name: Inject the package version into the browser bundle
        run: npm run build:js
      - name: npm pack --dry-run --json
        run: node scripts/check-npm-pack.cjs
      - name: Publish to npm
        run: npm publish --provenance --access public
