name: npm publish
# Thin caller. Publish logic is alpininsight/.github-private
# .github/workflows/npm-publish-reusable.yml (.github-private#730).
# Trusted publisher: repository ais-webmcp, this filename, environment
# npm-ais-webmcp. No npm token. The first publish is a manual bootstrap.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: alpininsight/.github-private/.github/workflows/npm-publish-reusable.yml@main
    with:
      package_dir: "."
      ref: ${{ inputs.tag }}
      environment: npm-ais-webmcp
