name: WebMCP CDN develop preview
run-name: WebMCP CDN ${{ inputs.mode || 'preview' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview publication or read-only audit of an existing main release delivery
        type: choice
        options: [preview, release-audit]
        default: preview
      producer_run_id:
        description: Existing release.yml run ID (release-audit only)
        type: string
        default: ''
      producer_attempt:
        description: Exact existing release run attempt (release-audit only)
        type: string
        default: '1'
      artifact_id:
        description: Immutable delivery artifact ID from that run (release-audit only)
        type: string
        default: ''
      version:
        description: Published Core version without v (release-audit only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: webmcp-cdn-develop
  cancel-in-progress: false
jobs:
  quality:
    if: inputs.mode == 'preview' && github.ref == 'refs/heads/develop' && vars.WEBMCP_CDN_PUBLISH_ENABLED == 'true'
    # ci.yml nests repository-policy (pull-requests: read); a caller that grants
    # less fails at startup even though that job is skipped off pull_request.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
  version:
    if: inputs.mode == 'preview'
    needs: quality
    uses: alpininsight/.github-private/.github/workflows/gitversion-reusable.yml@main
    with:
      checkout_ref: ${{ github.sha }}
  cdn:
    if: inputs.mode == 'preview'
    needs: [quality, version]
    uses: alpininsight/.github-private/.github/workflows/static-assets-reusable.yml@main
    with:
      checkout_ref: ${{ github.sha }}
      node_version: '24'
      setup_python: true
      python_version: '3.14'
      setup_uv: true
      install_command: uv sync --locked --all-groups
      mode: build
      build_command: uv run --locked python scripts/build_delivery.py --version "${{ needs.version.outputs.major_minor_patch }}" --output output/delivery
      upload_cdn: true
      asset_directory: output/delivery/cdn
      cdn_prefix: ais-webmcp
      cdn_version: ${{ needs.version.outputs.major_minor_patch }}
      cdn_asset_globs: '*.js,*.json'
      cdn_upload_immutable: false
      cdn_aliases: develop
      cdn_mutable_cache_control: public, max-age=300
      cdn_mutable_cache_max_age: '300'
      update_latest: false
    secrets:
      r2_access_key_id: ${{ secrets.CDN_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.CDN_R2_SECRET_ACCESS_KEY }}
      r2_endpoint: ${{ secrets.CDN_R2_ENDPOINT }}

  release-audit:
    if: inputs.mode == 'release-audit' && github.ref == 'refs/heads/develop'
    runs-on: general
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Audit the existing release delivery without building or publishing
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project --python 3.14 python scripts/audit_cdn_release.py \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-attempt "$PRODUCER_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" --version "$PACKAGE_VERSION" \
            --bundle output/release-audit/bundle --report output/release-audit/evidence.json
      - name: Retain the independent read-only audit receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webmcp-release-audit-${{ inputs.producer_run_id }}-${{ inputs.producer_attempt }}
          path: output/release-audit/evidence.json
          if-no-files-found: error
          retention-days: 14
