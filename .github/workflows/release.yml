name: WebMCP release
on:
  workflow_dispatch:
    inputs:
      release:
        description: Create the reviewed main GitHub release for the private Core PyPI publisher (requires the activation variable)
        type: boolean
        default: false
      cdn:
        description: Publish the matching CDN release after the core PyPI project is verified
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: webmcp-release
  cancel-in-progress: false
jobs:
  quality:
    # ci.yml nests repository-policy (pull-requests: read); a caller that grants
    # less fails at startup even though that job is skipped off pull_request.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
  version:
    needs: quality
    uses: alpininsight/.github-private/.github/workflows/gitversion-reusable.yml@main
    with:
      checkout_ref: ${{ github.sha }}
  source:
    needs: quality
    runs-on: general
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate explicit publication activation
        if: inputs.release || inputs.cdn
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          ENABLED: ${{ vars.WEBMCP_PYPI_PUBLISH_ENABLED }}
          CDN_REQUESTED: ${{ inputs.cdn }}
          CDN_ENABLED: ${{ vars.WEBMCP_CDN_PUBLISH_ENABLED }}
        run: |
          test "$SOURCE_REF" = refs/heads/main
          test "$ENABLED" = true
          if test "$CDN_REQUESTED" = true; then
            test "$CDN_ENABLED" = true
          fi
          python3 scripts/check_publication.py source --repository "$SOURCE_REPOSITORY" --sha "$SOURCE_SHA"
  build:
    needs: [source, version]
    runs-on: general
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Build exact delivery
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.major_minor_patch }}
        run: |
          uv sync --locked --all-groups
          uv run --locked python scripts/build_delivery.py --version "$PACKAGE_VERSION" --output output/delivery
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: artifact
        with:
          name: webmcp-delivery-${{ github.sha }}
          path: output/delivery/
          if-no-files-found: error
          retention-days: 14
  release:
    if: inputs.release
    needs: [quality, source, version, build]
    permissions:
      contents: write
    uses: alpininsight/.github-private/.github/workflows/reusable-release.yml@main
    with:
      checkout_ref: ${{ github.sha }}
      expected_version: ${{ needs.version.outputs.major_minor_patch }}
  # PyPI publication uses the named top-level ais-webmcp publisher in
  # alpininsight/.github-private (environment pypi-ais-webmcp).
  # This handoff records the exact source SHA; it does not dispatch or upload.
  handoff:
    if: inputs.release
    needs: [release, version]
    runs-on: general
    timeout-minutes: 5
    steps:
      - name: Record the private PyPI publisher handoff
        env:
          SOURCE_SHA: ${{ github.sha }}
          PACKAGE_VERSION: ${{ needs.version.outputs.major_minor_patch }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          {
            printf 'Release %s on %s (version %s).\n\n' "$RELEASE_TAG" "$SOURCE_SHA" "$PACKAGE_VERSION"
            printf 'Core PyPI publication runs in alpininsight/.github-private:\n\n'
            printf '```bash\n'
            for workflow in ais-webmcp-publish-python.yml; do
              printf 'gh workflow run %s --repo alpininsight/.github-private --ref main -f source_sha=%s -F publish=false\n' "$workflow" "$SOURCE_SHA"
            done
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
  # CDN only after the core PyPI project carry exactly these (reproducible) files.
  pypi-verified:
    if: inputs.cdn
    needs: [source, version, build]
    runs-on: general
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: bundle
          merge-multiple: true
      - name: Require the core PyPI project with this build's exact files
        timeout-minutes: 6
        env:
          SOURCE_SHA: ${{ github.sha }}
          PACKAGE_VERSION: ${{ needs.version.outputs.major_minor_patch }}
        run: |
          python3 scripts/check_publication.py bundle --sha "$SOURCE_SHA" --version "$PACKAGE_VERSION"
          python3 scripts/check_publication.py index --version "$PACKAGE_VERSION"
  cdn:
    if: inputs.cdn && vars.WEBMCP_CDN_PUBLISH_ENABLED == 'true'
    needs: [pypi-verified, version]
    uses: alpininsight/.github-private/.github/workflows/static-assets-reusable.yml@main
    with:
      checkout_ref: ${{ github.sha }}
      node_version: '24'
      setup_python: true
      python_version: '3.14'
      setup_uv: true
      install_command: uv sync --locked --all-groups
      mode: build
      build_command: uv run --locked python scripts/build_delivery.py --version "${{ needs.version.outputs.major_minor_patch }}" --output output/delivery
      upload_cdn: true
      asset_directory: output/delivery/cdn
      cdn_prefix: ais-webmcp
      cdn_version: ${{ needs.version.outputs.major_minor_patch }}
      cdn_asset_globs: '*.js,*.json'
      cdn_aliases: main
      cdn_mutable_cache_control: public, max-age=300
      cdn_mutable_cache_max_age: '300'
      update_latest: true
    secrets:
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      r2_endpoint: ${{ secrets.R2_ENDPOINT }}
  cdn-verified:
    if: inputs.cdn
    needs: [cdn, build, version]
    runs-on: general
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: bundle
          merge-multiple: true
      - name: Verify every canonical public CDN object's full bytes and headers
        env:
          SOURCE_SHA: ${{ github.sha }}
          PACKAGE_VERSION: ${{ needs.version.outputs.major_minor_patch }}
        run: |
          python3 scripts/check_publication.py bundle --sha "$SOURCE_SHA" --version "$PACKAGE_VERSION"
          python3 scripts/check_publication.py cdn --version "$PACKAGE_VERSION" --report cdn-evidence.json
      - name: Retain the public CDN evidence separately from package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webmcp-public-cdn-${{ github.sha }}
          path: cdn-evidence.json
          if-no-files-found: error
          retention-days: 14
