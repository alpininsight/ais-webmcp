name: Scheduled pre-commit update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  autoupdate:
    permissions:
      contents: write
      pull-requests: write
    uses: alpininsight/.github-private/.github/workflows/scheduled-pre-commit-update-reusable.yml@main
    secrets:
      automation_token: ${{ secrets.INSIGHT_TOKEN }}
