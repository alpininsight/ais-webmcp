[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "ais-webmcp"
dynamic = ["version"]
description = "Create, validate and manage WebMCP manifests for any kind of website"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639: a short License-Expression on PyPI instead of the full text.
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alpin Insight Solutions GmbH & Co. KG" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["jsonschema>=4.23,<5", "pyyaml>=6.0.2,<7"]

[project.urls]
Homepage = "https://github.com/alpininsight/insight-ui-webmcp"
Documentation = "https://github.com/alpininsight/insight-ui-webmcp/tree/develop/docs"
Issues = "https://github.com/alpininsight/insight-ui-webmcp/issues"

[project.scripts]
ais-webmcp = "ais_webmcp.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0.dev0"
search_parent_directories = true

[tool.hatch.build.targets.wheel]
packages = ["src/ais_webmcp", "src/webmcp_manifest"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.hatch.build.hooks.custom]
path = "src/ais_webmcp/build_hook.py"
