[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "ais-webmcp"
dynamic = ["version"]
description = "Create, validate and manage WebMCP manifests for any kind of website"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639: a short License-Expression on PyPI instead of the full text.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alpin Insight Solutions GmbH & Co. KG" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["jsonschema>=4.23,<5", "pyyaml>=6.0.2,<7"]

[project.urls]
Homepage = "https://insight-ui-webmcp.alpininsight.ai/"
Documentation = "https://insight-ui-webmcp.alpininsight.ai/"
Repository = "https://github.com/alpininsight/ais-webmcp"
Issues = "https://github.com/alpininsight/ais-webmcp/issues"
Changelog = "https://github.com/alpininsight/ais-webmcp/blob/main/CHANGELOG.md"

[project.scripts]
ais-webmcp = "ais_webmcp.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_webmcp", "src/webmcp_manifest"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.hatch.build.hooks.custom]
path = "src/ais_webmcp/build_hook.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--no-showlocals"]
markers = ["unit: isolated unit tests", "integration: installed-distribution tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
exclude = [".git", ".venv", "build", "dist", "output"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.5,<5",
    "pytest>=9.1.1",
    "ruff==0.16.10",
]
